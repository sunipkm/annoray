[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rarray"
description = "xarray-rs for Python: safe, fast, units-aware labelled arrays and netCDF/HDF5 I/O in Rust"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.26", "xarray>=2025.1"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest", "pandas", "cftime", "netCDF4", "h5netcdf"]

# xr.open_dataset(path, engine="rarray")
[project.entry-points."xarray.backends"]
rarray = "rarray.backend:RarrayBackendEntrypoint"

[tool.maturin]
python-source = "python"
module-name = "rarray._rarray"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]
