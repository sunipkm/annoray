[package]
name = "xarray-rs"
description = "A units-aware, xarray-like library for labelled n-dimensional arrays, with netCDF and HDF5 I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xr-core.workspace = true
xr-macros.workspace = true
xr-units.workspace = true
xr-io.workspace = true
xr-cf.workspace = true
xr-io-c = { workspace = true, optional = true }
xr-netcdf3.workspace = true
xr-netcdf4.workspace = true
thiserror.workspace = true
xr-hdf5.workspace = true

[features]
default = ["rayon"]
# Decompress HDF5/netCDF-4 chunks in parallel.
rayon = ["xr-hdf5/rayon"]
# The netCDF-C/HDF5 C libraries as an alternative backend (built from source; needs cmake).
# Not needed for I/O: netCDF-3, netCDF-4 and HDF5 are read and written in pure Rust.
netcdf-c = ["dep:xr-io-c"]

[dev-dependencies]
chrono.workspace = true
trybuild.workspace = true

[lints]
workspace = true
