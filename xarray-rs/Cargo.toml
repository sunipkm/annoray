[package]
name = "xarray-rs"
description = "A units-aware, xarray-like library for labelled n-dimensional arrays, with netCDF and HDF5 I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
xr-core.workspace = true
xr-macros.workspace = true
xr-units.workspace = true
xr-io.workspace = true
xr-cf.workspace = true
xr-io-c = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# netCDF-3/netCDF-4 I/O through the C libraries (built from source; needs cmake).
netcdf-c = ["dep:xr-io-c"]

[dev-dependencies]
chrono.workspace = true
trybuild.workspace = true

[lints]
workspace = true
