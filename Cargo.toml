[workspace]
resolver = "3"
members = [
    "crates/xr-cf",
    "crates/xr-core",
    "crates/xr-hdf5",
    "crates/xr-io",
    "crates/xr-io-c",
    "crates/xr-macros",
    "crates/xr-netcdf3",
    "crates/xr-units",
    "xarray-rs",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
xr-core = { path = "crates/xr-core", version = "0.0.1" }
xr-macros = { path = "crates/xr-macros", version = "0.0.1" }
xr-units = { path = "crates/xr-units", version = "0.0.1" }
xr-io = { path = "crates/xr-io", version = "0.0.1" }
xr-cf = { path = "crates/xr-cf", version = "0.0.1" }
xr-io-c = { path = "crates/xr-io-c", version = "0.0.1" }
xr-netcdf3 = { path = "crates/xr-netcdf3", version = "0.0.1" }
xr-hdf5 = { path = "crates/xr-hdf5", version = "0.0.1" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
miniz_oxide = "0.8"
ndarray = "0.17"
smallvec = "1"
thiserror = "2"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

proptest = "1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# No panics in library code: every failure is propagated as a `Result` (PLAN.md §2a).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
arithmetic_side_effects = "warn"
missing_errors_doc = "warn"
