[workspace]
resolver = "3"
members = [
    "crates/annoray-cf",
    "crates/annoray-core",
    "crates/annoray-hdf5",
    "crates/annoray-io",
    "crates/annoray-io-c",
    "crates/annoray-macros",
    "crates/annoray-netcdf3",
    "crates/annoray-netcdf4",
    "crates/annoray-units",
    "annoray",
    "annoray-python",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
libc = "0.2"
annoray = { path = "annoray", version = "0.0.1" }
annoray-core = { path = "crates/annoray-core", version = "0.0.1" }
annoray-macros = { path = "crates/annoray-macros", version = "0.0.1" }
annoray-units = { path = "crates/annoray-units", version = "0.0.1" }
annoray-io = { path = "crates/annoray-io", version = "0.0.1" }
annoray-cf = { path = "crates/annoray-cf", version = "0.0.1" }
annoray-io-c = { path = "crates/annoray-io-c", version = "0.0.1" }
annoray-netcdf3 = { path = "crates/annoray-netcdf3", version = "0.0.1" }
annoray-hdf5 = { path = "crates/annoray-hdf5", version = "0.0.1" }
annoray-netcdf4 = { path = "crates/annoray-netcdf4", version = "0.0.1" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
memmap2 = "0.9"
miniz_oxide = "0.8"
glob = "0.3"
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.10"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
ndarray = "0.17"
smallvec = "1"
thiserror = "2"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

proptest = "1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# No panics in library code: every failure is propagated as a `Result` (PLAN.md §2a).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
arithmetic_side_effects = "warn"
missing_errors_doc = "warn"
