[workspace]
resolver = "3"
members = [
    "crates/annoray-hdf5",
    "crates/annoray-macros",
    "crates/annoray-units",
    "annoray",
    "annoray-python",
]

[workspace.package]
version = "0.0.0"
authors = ["Sunip K. Mukherjee <sunipkmukherjee@gmail.com>"]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunipkm/annoray"
homepage = "https://github.com/sunipkm/annoray"

[workspace.dependencies]
libc = "0.2"
annoray = { path = "annoray", version = "=0.0.0" }
annoray-macros = { path = "crates/annoray-macros", version = "=0.0.0" }
annoray-units = { path = "crates/annoray-units", version = "=0.0.0" }
annoray-hdf5 = { path = "crates/annoray-hdf5", version = "=0.0.0" }

chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
memmap2 = "0.9"
miniz_oxide = "0.9"
glob = "0.3"
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.10"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
ndarray = "0.17"
netcdf = { version = "0.12", features = ["static", "ndarray"] }
smallvec = "1"
thiserror = "2"
typenum = "1.18"

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

proptest = "1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
arithmetic_side_effects = "warn"
missing_errors_doc = "warn"
