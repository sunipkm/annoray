[package]
name = "annoray"
description = "A units-aware, xarray-like library for labelled n-dimensional arrays, with pure-Rust netCDF and HDF5 I/O"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/annoray"
readme = "README.md"
keywords = ["xarray", "netcdf", "hdf5", "units", "ndarray"]
categories = ["science", "science::geo", "data-structures"]

[dependencies]
annoray-hdf5.workspace = true
annoray-macros.workspace = true
annoray-units.workspace = true
chrono.workspace = true
glob.workspace = true
indexmap.workspace = true
ndarray.workspace = true
netcdf = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
smallvec.workspace = true
thiserror.workspace = true
uom = { workspace = true, optional = true }
whippyunits = { workspace = true, optional = true }

[features]
default = ["rayon", "zstd", "lz4"]
# Compute rolling windows, reductions and arithmetic, CF-decode, and decompress HDF5/netCDF-4
# chunks, on several threads.
rayon = ["dep:rayon", "ndarray/rayon", "annoray-hdf5/rayon"]
# Read and write Zstandard- and LZ4-compressed HDF5/netCDF-4 chunks (pure Rust). LZF is always
# read.
zstd = ["annoray-hdf5/zstd"]
lz4 = ["annoray-hdf5/lz4"]
# The netCDF-C/HDF5 C libraries as an alternative backend (built from source; needs cmake).
# Not needed for I/O: netCDF-3, netCDF-4 and HDF5 are read and written in pure Rust.
netcdf-c = ["dep:netcdf"]
# Arrays and `sel` labels of uom SI quantities (`to_typed`, `from_typed`).
uom = ["dep:uom", "annoray-units/uom"]
# Arrays and `sel` labels of whippyunits quantities, with zero-copy `view_typed`.
whippyunits = ["dep:whippyunits", "annoray-units/whippyunits"]

[dev-dependencies]
proptest.workspace = true
trybuild.workspace = true

[lints]
workspace = true
