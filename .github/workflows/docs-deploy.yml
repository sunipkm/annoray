name: Docs deploy

# Publishes the `docs-html` artifact of the calling run (built by docs.yml) to GitHub Pages:
# the gh-pages branch, under /<version>/, and /stable/ for the newest release. Pages must be
# enabled for the repository, serving the gh-pages branch.

on:
  workflow_call:
    inputs:
      version:
        description: "X.Y, or dev"
        type: string
        required: true
      stable:
        description: "Also publish as /stable/ (when the version is the newest release)"
        type: boolean
        required: true

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: html
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Deploy to gh-pages
        env:
          VERSION: ${{ inputs.version }}
          STABLE: ${{ inputs.stable && '--stable' || '' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add -B gh-pages site origin/gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          python docs/_tools/deploy.py --site site --html html --version "$VERSION" $STABLE
          cd site
          git add -A
          git commit -m "docs: $VERSION ($GITHUB_SHA)" || { echo "nothing to deploy"; exit 0; }
          git push origin gh-pages
