name: Docs

# Builds the documentation: every public name in the API reference (check_api.py), executed
# examples, warnings as errors. The HTML is uploaded as the `docs-html` artifact.
#
# - Called by release.yml for every version tag, beside the CI: the release publishes
#   nothing unless this passes. release.yml deploys the same HTML once the release is out.
# - Called by docs-dev.yml (run by hand) for /dev/.
#
# It only reads: deploying is docs-deploy.yml's job, so callers need grant nothing more.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag (vX.Y.Z or vX.Y.Z-preN); empty for dev"
        type: string
        default: ""
    outputs:
      version:
        description: "Where the build belongs on the site: X.Y.Z, X.Y.Z-preN, or dev"
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which version
        id: v
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then
            # One directory per release on the site (X.Y.Z or X.Y.Z-preN).
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/version.py --write
      # The extension is built once and installed; the docs import it for docstrings.
      - name: Build and install annoray
        run: |
          pip install maturin -c ci/constraints.txt
          maturin build --release -m annoray-python/Cargo.toml --out dist
          pip install dist/*.whl -c ci/constraints.txt
      # At the versions in ci/constraints.txt (see ci/README.md).
      - run: pip install -r docs/requirements.txt -c ci/constraints.txt
      - run: python docs/_tools/check_api.py
      - name: Build the documentation
        env:
          DOCS_VERSION: ${{ steps.v.outputs.version }}
        run: sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html
      # GitHub's artifact service sometimes times out past the action's own retries (five, within
      # a minute): two more tries, after one and then two minutes, before the job fails.
      - id: upload-docs-1
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
      - if: steps.upload-docs-1.outcome == 'failure'
        run: sleep 60
      - id: upload-docs-2
        if: steps.upload-docs-1.outcome == 'failure'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
          overwrite: true
      - if: steps.upload-docs-2.outcome == 'failure'
        run: sleep 120
      - if: steps.upload-docs-2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
          overwrite: true
