name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-preN) publishes that version: the Rust crates to crates.io,
# the Python package to PyPI, and a GitHub release (marked as a pre-release for -preN tags),
# then the documentation of releases (not pre-releases) to GitHub Pages. The version comes
# from the tag (tools/version.py). The full CI (ci.yml) and the documentation build (docs.yml)
# run first; every release job waits for both, so nothing is built or published unless both
# pass.
#
# Needs: a CARGO_REGISTRY_TOKEN secret, and this workflow registered as a trusted publisher
# for the `annoray` project on PyPI (environment `pypi`).

on:
  push:
    tags: ["v[0-9]*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ github.ref_name }}

  crates:
    needs: [ci, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 tools/version.py --release
      # In dependency order; each waits until the previous one is available.
      - run: cargo publish --workspace --allow-dirty --exclude annoray-python
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    needs: [ci, docs]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/version.py --release
      # One abi3 wheel per platform (pyo3's `abi3-py311`): it serves CPython 3.11 and later.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: annoray-python
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: annoray-python/dist

  # The same wheel on the oldest and newest supported Pythons, with every optional test
  # dependency, before anything is published.
  test-wheels:
    needs: [wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
      - run: python -m pip install "$(ls dist/*.whl)[test]"
      # From annoray-python/ the package source (python/annoray) is not importable, so the
      # tests run against the installed wheel.
      - run: python -m pytest tests -q -W error::DeprecationWarning
        working-directory: annoray-python

  sdist:
    needs: [ci, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/version.py --release
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: annoray-python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: annoray-python/dist

  pypi:
    needs: [ci, docs, wheels, sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  # A GitHub release for the tag, with the wheels and sdist, once both registries have the
  # version. Pre-release tags (vX.Y.Z-preN) are marked as pre-releases and never become the
  # "Latest" release; crates.io (semver `-preN`) and PyPI (PEP 440 `rcN`) already treat those
  # versions as pre-releases, so `cargo add` and `pip install` skip them unless asked.
  github-release:
    needs: [crates, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-pre* ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--latest)
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${kind[@]}"

  # The documentation built (and checked) above, on GitHub Pages under /X.Y/ and /stable/,
  # once the release is out. Pre-releases leave the published versions as they are.
  docs-deploy:
    needs: [docs, github-release]
    if: ${{ !contains(github.ref_name, '-pre') }}
    permissions:
      contents: write
    uses: ./.github/workflows/docs-deploy.yml
    with:
      version: ${{ needs.docs.outputs.version }}
      stable: true
