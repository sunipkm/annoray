name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-features` builds netCDF-C and HDF5 from source (cmake is preinstalled on all runners).
      - run: cargo test --workspace --all-features
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.13"
      - name: Python xarray reads our files
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install xarray netCDF4 cftime
          cargo test -p xarray-rs --features netcdf-c --test netcdf_io -- --ignored python

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # trybuild's expected compiler output is pinned to stable, so MSRV only builds and runs unit
      # tests. The optional netcdf-c backend (MSRV 1.85.1) is not part of this job.
      - run: cargo check --workspace --exclude xr-io-c --all-targets
      - run: cargo test --workspace --exclude xr-io-c --lib
