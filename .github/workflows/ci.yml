name: CI

# Runs only when publishing: the release workflow calls it (on a version tag) and publishes
# nothing unless it passes. It can also be run by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Line tables only: backtraces keep file:line, and the many test binaries stay small enough
  # for the runners' disks (full debug info filled ubuntu-latest: the linker died of SIGBUS).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Each typed-unit bridge on its own (the all-features run covers them together).
      - run: cargo clippy -p annoray --all-targets --features uom -- -D warnings
      - run: cargo clippy -p annoray --all-targets --features whippyunits -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space (preinstalled toolchains this build does not use)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--all-features` builds netCDF-C and HDF5 from source (cmake is preinstalled on all runners).
      - run: cargo test --workspace --all-features
      # Without C libraries: netCDF-3 must work in pure Rust, netCDF-4 must fail clearly.
      - run: cargo test -p annoray
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.13"
      - name: Python xarray reads our files
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install xarray netCDF4 cftime h5py hdf5plugin
          cargo test -p annoray --features netcdf-c --test netcdf_io -- --ignored python
          cargo test -p annoray-hdf5 --test write_round_trip -- --ignored
          cargo test -p annoray --test nat -- --ignored
          cargo test -p annoray --test tree -- --ignored
          cargo test -p annoray-hdf5 --all-features --test write_codecs -- --ignored

  python:
    # annoray for Python (M9): native objects and the xarray engine, tested against xarray;
    # the examples must also run without xarray and match their Rust twins.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space (preinstalled toolchains this build does not use)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # hdf5plugin: imported by the fixture scripts pyright checks.
      - run: pip install "./annoray-python[test]" hdf5plugin ruff pyright
      # numbagg (with numba and llvmlite, ~160 MB) is only the reference for rolling_exp,
      # whose arithmetic does not depend on the platform: one job is enough. Elsewhere those
      # tests skip.
      - name: Reference for rolling_exp
        if: matrix.os == 'ubuntu-latest'
        run: pip install --no-cache-dir numbagg
      # Text read or written without an encoding takes the locale's (cp1252 on Windows): the
      # warning makes it an error in annoray and its tests on every platform (pyproject.toml).
      - run: pytest annoray-python/tests
        env:
          PYTHONWARNDEFAULTENCODING: "1"
      - name: Lint and type-check the Python package
        if: matrix.os == 'ubuntu-latest'
        working-directory: annoray-python
        run: |
          ruff check .
          ruff format --check .
          pyright

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      # trybuild's expected compiler output is pinned to stable, so MSRV only builds and runs unit
      # tests. The optional netcdf-c feature (which builds the C libraries) is not part of this job.
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --lib
