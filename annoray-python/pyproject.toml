[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "annoray"
description = "Annotated arrays: labelled, units-aware N-dimensional arrays with netCDF and HDF5 I/O, in Rust"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["numpy>=1.26"]
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Interoperability with xarray (engine="annoray", to_xarray/from_xarray).
xarray = ["xarray>=2025.1"]
# Dates in non-standard CF calendars (noleap, 360_day, ...) as cftime objects.
cftime = ["cftime"]
test = ["pytest", "xarray>=2025.1", "pandas", "cftime", "netCDF4", "h5netcdf"]

# xr.open_dataset(path, engine="annoray") (used only when xarray is installed)
[project.entry-points."xarray.backends"]
annoray = "annoray.backend:AnnorayBackendEntrypoint"

[tool.maturin]
python-source = "python"
module-name = "annoray._annoray"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["annoray"]

[tool.pyright]
pythonVersion = "3.11"
include = ["python", "tests", "examples", "bench"]
