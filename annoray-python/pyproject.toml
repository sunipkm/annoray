[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "annoray"
description = "Annotated arrays: labelled, units-aware N-dimensional arrays with netCDF and HDF5 I/O, in Rust"
readme = "README.md"
authors = [{ name = "Sunip K. Mukherjee", email = "sunipkmukherjee@gmail.com" }]
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]
dynamic = ["version"]
keywords = ["xarray", "netcdf", "hdf5", "units", "labelled arrays", "climate", "cf-conventions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/sunipkm/annoray"
Repository = "https://github.com/sunipkm/annoray"
Issues = "https://github.com/sunipkm/annoray/issues"
Changelog = "https://github.com/sunipkm/annoray/releases"

[project.optional-dependencies]
# Interoperability with xarray (engine="annoray", to_xarray/from_xarray).
xarray = ["xarray>=2025.1"]
# Conversions to and from astropy units and quantities (to_astropy, from_astropy).
astropy = ["astropy>=6"]
# Dates in non-standard CF calendars (noleap, 360_day, ...) as cftime objects.
cftime = ["cftime"]
# Date-times as whenever objects (`.dt.to_whenever()`); whenever's date-times are read
# without it.
whenever = ["whenever>=0.10"]
# Everything the test suite uses (tests skip what is missing).
test = [
    "pytest",
    "xarray>=2025.1",
    "pandas",
    "cftime",
    "netCDF4",
    "h5netcdf",
    "h5py",
    "astropy>=6",
    "zarr>=3",
    "scipy",
    "bottleneck",
    "cf_xarray",
    "pint",
    "dask",
    "whenever>=0.10",
]

# xr.open_dataset(path, engine="annoray") (used only when xarray is installed)
[project.entry-points."xarray.backends"]
annoray = "annoray.backend:AnnorayBackendEntrypoint"

[tool.maturin]
python-source = "python"
module-name = "annoray._annoray"
features = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Text read or written without an encoding is the locale's (cp1252 on Windows): an error in
# annoray and its tests when Python reports it (PYTHONWARNDEFAULTENCODING=1, as in CI).
filterwarnings = ["error::EncodingWarning:(annoray|test_|conftest)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["annoray"]

[tool.pyright]
pythonVersion = "3.11"
include = ["python", "tests", "examples", "bench"]
