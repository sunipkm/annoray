[package]
name = "annoray-units"
description = "Physical units with exact scales: UDUNITS-2/CF parsing, conversion, CF calendars and dimension-typed quantities"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/annoray-units"
readme = "README.md"
keywords = ["units", "udunits", "dimensional-analysis", "cf-conventions", "calendar"]
categories = ["science", "date-and-time", "mathematics"]

[dependencies]
jiff.workspace = true
thiserror.workspace = true
typenum.workspace = true
uom = { workspace = true, optional = true }
whippyunits = { workspace = true, optional = true }

[features]
# Build the IANA time zone database into the program, for systems without one.
tzdb-bundle = ["jiff/tzdb-bundle-always"]
# Conversions to and from uom's SI quantities (`StaticUnit`).
uom = ["dep:uom"]
# Conversions to and from whippyunits quantities (`StaticUnit`, zero-copy array views).
whippyunits = ["dep:whippyunits"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
