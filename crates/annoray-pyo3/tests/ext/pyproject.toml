# A test extension module for annoray-pyo3 (not published): round trips of annoray values
# between Python and another extension's Rust. Build it with maturin and run
# crates/annoray-pyo3/tests/test_interop.py.
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "annoray-pyo3-test"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["annoray", "numpy"]

[tool.maturin]
module-name = "annoray_pyo3_test"
