[package]
name = "annoray-hdf5"
description = "Pure-Rust HDF5 reader and writer: every layout and chunk index, common compression filters, safe on untrusted files"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/annoray-hdf5"
readme = "README.md"
keywords = ["hdf5", "netcdf", "scientific", "file-format", "compression"]
categories = ["science", "encoding", "parser-implementations"]

[dependencies]
lz4_flex = { workspace = true, optional = true }
memmap2.workspace = true
miniz_oxide.workspace = true
ndarray.workspace = true
rayon = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# Decompress chunks in parallel.
rayon = ["dep:rayon"]
# Read Zstandard-compressed chunks (HDF5 filter 32015, as netCDF-C writes), in pure Rust.
zstd = ["dep:ruzstd"]
# Read LZ4-compressed chunks (HDF5 filter 32004), in pure Rust.
lz4 = ["dep:lz4_flex"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
