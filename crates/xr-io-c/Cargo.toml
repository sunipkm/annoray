[package]
name = "xr-io-c"
description = "netCDF/HDF5 backend for xarray-rs using the C libraries (netCDF-C, HDF5), built from source"
version.workspace = true
edition.workspace = true
# netcdf-sys pulls in hdf5-metno-sys, which needs 1.85.1.
rust-version = "1.85.1"
license.workspace = true

[dependencies]
indexmap.workspace = true
ndarray.workspace = true
netcdf = { version = "0.12", features = ["static", "ndarray"] }
thiserror.workspace = true
xr-core.workspace = true
xr-io.workspace = true

[dev-dependencies]
ndarray.workspace = true

[lints]
workspace = true
