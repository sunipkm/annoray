[package]
name = "xr-hdf5"
description = "Pure-Rust HDF5 reader and writer for xarray-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap.workspace = true
miniz_oxide.workspace = true
ndarray.workspace = true
lz4_flex = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }
xr-core.workspace = true
xr-io.workspace = true

[features]
# Decompress chunks in parallel.
rayon = ["dep:rayon"]
# Read Zstandard-compressed chunks (HDF5 filter 32015, as netCDF-C writes), in pure Rust.
zstd = ["dep:ruzstd"]
# Read LZ4-compressed chunks (HDF5 filter 32004), in pure Rust.
lz4 = ["dep:lz4_flex"]

[dev-dependencies]
proptest.workspace = true
xr-io-c.workspace = true

[lints]
workspace = true
